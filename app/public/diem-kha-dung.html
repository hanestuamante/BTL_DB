<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Điểm khả dụng</title>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/points.js"></script>
</head>
<body>
  <nav aria-label="Menu chính" data-navigation></nav>
  <main>
    <header class="page-header">
      <h1>Điểm khả dụng</h1>
    </header>
    <form id="points-form" class="filters payment" aria-label="Chọn khách hàng">
      <label>Khách hàng <select name="maKhachHang"><option value="">Chọn khách hàng</option></select></label>
    </form>
    <div class="payment-result" id="points-result" aria-live="polite" hidden>
      <p>Điểm khả dụng</p>
      <output id="points" form="points-form"></output>
    </div>
  </main>
  <p class="toast" data-toast role="status" hidden></p>
</body>
</html>
